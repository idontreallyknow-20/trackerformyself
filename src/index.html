<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bulk Tracker | a calorie tracker for bulking by Joseph Leung</title>
    <meta
      name="description"
      content="Bulk Tracker is a free calorie and macro tracker for bulking, built by Joseph Leung. Log meals from a photo or a name lookup, and track protein, bodyweight and your creatine streak."
    />
    <meta name="author" content="Joseph Leung" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="author" href="https://josephleung-site.vercel.app" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bulk Tracker" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Bulk Tracker | a calorie tracker for bulking by Joseph Leung" />
    <meta
      property="og:description"
      content="A free calorie and macro tracker where the daily goal is a floor to hit. Photo estimates, protein, bodyweight and creatine streaks."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bulk Tracker app by Joseph Leung: calorie ring, macros and creatine streak" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bulk Tracker | a calorie tracker for bulking by Joseph Leung" />
    <meta
      name="twitter:description"
      content="A free calorie and macro tracker where the daily goal is a floor to hit. Photo estimates, protein, bodyweight and creatine streaks."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Bulk Tracker app by Joseph Leung: calorie ring, macros and creatine streak" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#147D74" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bulk" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />

    <script type="application/ld+json">
%JSON_LD%
    </script>

    <style>
      html, body { margin: 0; padding: 0; background: #FBF3E4; }
      #root { min-height: 100vh; }
      .shell {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #2B2118; max-width: 480px; margin: 0 auto; box-sizing: border-box;
        padding: calc(18px + env(safe-area-inset-top)) 18px 24px;
      }
      .shell-head { display: flex; align-items: center; gap: 9px; }
      .shell-mark { width: 34px; height: 34px; background: #E2603F; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
      .shell h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
      .shell p { font-size: 14px; line-height: 1.55; color: #6F6457; margin: 18px 0 0; }
      .shell a { color: #147D74; font-weight: 700; }
    </style>
    %PRELOAD%
  </head>
  <body>
    <div id="root">
      <!-- replaced by the app once it loads -->
      <div class="shell">
        <div class="shell-head">
          <div class="shell-mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" /></svg>
          </div>
          <h1>Bulk Tracker</h1>
        </div>
        <p>
          A free calorie tracker for bulking, where the daily goal is a floor to hit. Log meals from a photo or a name
          lookup, and track macros, bodyweight and your creatine streak.
        </p>
        <p>Built by <a href="https://josephleung-site.vercel.app" rel="author">Joseph Leung</a>.</p>
        <noscript><p>Bulk Tracker needs JavaScript to run.</p></noscript>
      </div>
    </div>
    <script type="module" src="./%APP_JS%"></script>
  </body>
</html>
